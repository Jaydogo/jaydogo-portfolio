<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>:root{--m:7vw}
body{background:#1A1712 url(../img/rel-lierre.png) center/cover;color:#F2F1ED;position:relative}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,14,.72) 0,rgba(20,18,14,.25) 16%,rgba(20,18,14,0) 28%,rgba(20,18,14,0) 44%,rgba(20,18,14,.55) 62%,rgba(20,18,14,.92) 100%)}
.lg{position:absolute;left:50%;top:var(--m);width:14vw;transform:translateX(-50%)}
.rule{position:absolute;left:calc(var(--m) + .4vw);bottom:calc(var(--m) + 24.6vw);width:8vw;height:.12vw;background:#AD9B6F}
h1{position:absolute;left:var(--m);bottom:calc(var(--m) - 2.2vw);font-family:Taviraj;font-weight:300;font-style:italic;font-size:12.8vw;line-height:.98;letter-spacing:-.015em;white-space:nowrap;text-shadow:0 .2vw 1.5vw rgba(0,0,0,.25)}
.meta{position:absolute;right:var(--m);bottom:calc(var(--m) + 24.6vw - .7vw);font-family:'DM Mono';font-size:1.9vw;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,241,237,.9)}</style>
<img class="lg" src="../img/rc-logo-clair.svg">

<h1>Ailleurs,<br>autrement.</h1>
