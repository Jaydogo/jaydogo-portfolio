<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>:root{--u:1vmin;--m:calc(var(--u)*7)}
body{background:#2D4999;color:#2D4999;font-family:Poppins;position:relative;overflow:hidden}
.ph,.clear{position:absolute;inset:-3vh -3vw;background:url(../img/picard-fete-net.jpg) 46% 50%/auto 104%}
.frost{position:absolute;inset:0;backdrop-filter:blur(calc(var(--u)*2.4)) saturate(.75) brightness(1.15);background:rgba(226,233,248,.6)}
.clear{-webkit-mask-image:radial-gradient(ellipse 44% 20% at 50% 36%,#000 78%,transparent 100%),radial-gradient(ellipse 28% 15% at 30% 46%,#000 70%,transparent 100%),radial-gradient(ellipse 30% 14% at 70% 28%,#000 70%,transparent 100%),radial-gradient(ellipse 22% 10% at 62% 50%,#000 60%,transparent 100%)}
.fl{position:absolute;left:calc(var(--m) - var(--u)*1);top:calc(var(--m) - var(--u)*2);width:calc(var(--u)*30)}
.d{position:absolute;right:var(--m);top:calc(var(--m) + var(--u)*1);font-weight:700;font-size:calc(var(--u)*6.4);letter-spacing:-.03em}
h1{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--u)*14);font-family:'Zilla Slab';font-style:italic;font-weight:600;font-size:calc(var(--u)*13);line-height:.95}
.m{position:absolute;left:var(--m);right:var(--m);bottom:var(--m);border-top:calc(var(--u)*.35) solid #2D4999;padding-top:calc(var(--u)*1.8);font-weight:600;font-size:calc(var(--u)*2.8);display:flex;justify-content:space-between}</style>
<div class="ph"></div><div class="frost"></div><div class="clear"></div>
<img class="fl" src="../img/picard-logo.svg"><div class="d">−18 °C</div>
<h1>Le goût,<br>mis au frais.</h1><div class="m"><span>Édition des fêtes</span><span>Surgelés</span><span>picard.fr</span></div>
