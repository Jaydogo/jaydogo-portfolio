<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_ely.css">
<style>:root{--m:calc(var(--u)*7);--l:34vw}
.top,.bot{position:absolute;left:0;right:0;filter:grayscale(1) contrast(1.3)}
.top{top:0;height:54vh;background:url(../img/ely-n385.jpg) 92% 20%/auto 125%;clip-path:polygon(0 0,100% 0,100% 86%,0 100%)}
.bot{bottom:0;height:54vh;background:url(../img/ely-n231.jpg) 48% 18%/cover;clip-path:polygon(0 14%,100% 0,100% 100%,0 100%)}
.sh{background:linear-gradient(180deg,rgba(18,16,16,.75) 0,rgba(18,16,16,0) 14%,rgba(18,16,16,0) 76%,rgba(18,16,16,.92) 92%)}
.band{position:absolute;left:-10vw;right:-10vw;top:50%;height:calc(var(--u)*10);transform:translateY(-50%) rotate(-5.5deg);background:var(--o);display:flex;align-items:center;justify-content:flex-end;padding-right:calc(10vw + var(--m))}
.band b{color:var(--n);font-weight:900;font-size:calc(var(--u)*11);letter-spacing:-.05em;line-height:1}
.mast{left:var(--l);right:var(--m);top:var(--m);grid-template-columns:1fr 1fr 1fr;white-space:nowrap}
.mast span:nth-child(2){text-align:center}
.vn{position:absolute;right:var(--m);font-weight:900;font-size:calc(var(--u)*10.5);line-height:.8;letter-spacing:-.04em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.v1{top:calc(var(--u)*15)}
.v2{bottom:calc(var(--u)*23);color:var(--o)}
.info{left:var(--l);right:var(--m);bottom:var(--m);grid-template-columns:1fr 1fr 1fr}</style>
<div class="top"></div><div class="bot"></div><div class="sh"></div>
<div class="band"><b>VS</b></div>
<div class="mast"><span>Elyte Club</span><span>Battle Nº 04</span><span>Paris</span></div>
<div class="vn v1">Nova</div><div class="vn v2">Sayan</div>
<div class="info"><div>Nova<b>1 248</b></div><div>Sayan<b>1 301</b></div><div>Format<b>1 vs 1</b></div></div>
